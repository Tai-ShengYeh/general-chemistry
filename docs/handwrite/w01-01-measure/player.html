<script>
const META={"width": 1920, "height": 1080, "duration": 114.751, "scenes": [{"index": 0, "start": 0.0, "end": 17.296, "title": "數字後面，要有單位", "pause": false}, {"index": 1, "start": 17.296, "end": 34.882, "title": "物理變化，還是化學變化", "pause": false}, {"index": 2, "start": 34.882, "end": 48.481, "title": "0.05080 有幾位有效數字", "pause": true}, {"index": 3, "start": 48.481, "end": 61.616, "title": "答案：四位", "pause": false}, {"index": 4, "start": 61.616, "end": 80.408, "title": "加減看小數位，乘除看有效位", "pause": false}, {"index": 5, "start": 80.408, "end": 96.591, "title": "相減之後，不能沿用四位", "pause": true}, {"index": 6, "start": 96.591, "end": 114.751, "title": "小差值，要特別留意", "pause": false}]};
