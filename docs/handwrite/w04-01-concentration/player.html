<script>
const META={"width": 1920, "height": 1080, "duration": 110.072, "scenes": [{"index": 0, "start": 0.0, "end": 15.517, "title": "濃度，先問分母是什麼", "pause": false}, {"index": 1, "start": 15.517, "end": 29.581, "title": "定容，是最後的總體積", "pause": false}, {"index": 2, "start": 29.581, "end": 45.407, "title": "25.0 g鹽配成500.0 mL", "pause": true}, {"index": 3, "start": 45.407, "end": 59.12, "title": "答案：0.856 M", "pause": false}, {"index": 4, "start": 59.12, "end": 78.253, "title": "0.9%要加上濃度種類", "pause": false}, {"index": 5, "start": 78.253, "end": 92.202, "title": "ppm一定等於mg/L嗎", "pause": true}, {"index": 6, "start": 92.202, "end": 110.072, "title": "只有密度合適，數字才近似相同", "pause": false}]};

const speed=()=>Number(document.querySelector('#speed').value);
