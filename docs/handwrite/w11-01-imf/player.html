" title="手寫教學動畫"></iframe></div>
<nav aria-label="播放控制">
<button id="play" disabled>播放</button><button id="prev">上一幕</button><button id="next">下一幕</button><button id="reset">重新開始</button>
<label>速度 <select id="speed"><option value="0.75">0.75 倍</option><option value="1" selected>1 倍</option><option value="1.25">1.25 倍</option></select></label>
</nav>
<input id="seek" type="range" min="0" step="0.01" value="0" aria-label="動畫時間軸">
<div id="status" role="status" aria-live="polite">正在載入動畫…</div>
<small id="hint">題目停下來時，先想答案，再按「繼續」。可隨時暫停、重播或切換幕次。</small>
</main>
<script>
const META={"width": 1920, "height": 1080, "duration": 112.366, "scenes": [{"index": 0, "start": 0.0, "end": 17.554, "title": "所有分子都有分散力", "pause": false}, {"index": 1, "start": 17.554, "end": 34.755, "title": "乙醇與二甲醚，元素一樣但結構不同", "pause": false}, {"index": 2, "start": 34.755, "end": 49.379, "title": "誰的沸點較高", "pause": true}, {"index": 3, "start": 49.379, "end": 66.135, "title": "答案：乙醇", "pause": false}, {"index": 4, "start": 66.135, "end": 82.325, "title": "分子較大，分散力也可能很強", "pause": false}, {"index": 5, "start": 82.325, "end": 97.908, "title": "水沸騰，氧氫共價鍵斷了嗎", "pause": true}, {"index": 6, "start": 97.908, "end": 112.366, "title": "相變時，仍然是水分子", "pause": false}]};
const frame=document.querySelector('#frame'), screen=document.querySelector('#screen');
const play=document.querySelector('#play'), seek=document.querySelector('#seek'), status=document.querySelector('#status');
let doc,tl, time=0, playing=false, last=null, answered=new Set(), ready=false;
const speed=()=>Number(document.querySelector('#speed').value);
const sceneAt=t=>Math.max(0,META.scenes.findLastIndex(s=>t>=s.start));
const media=()=>doc ? [...doc.querySelectorAll('audio')] : [];
function resize(){const scale=screen.clientWidth/META.width;screen.style.height=(META.height*scale)+'px';frame.style.width=META.width+'px';frame.style.height=META.height+'px';frame.style.transform=`scale(${scale})`}
function stop(){playing=false;play.textContent='播放';media().forEach(a=>a.pause());last=null}
function syncAudio(force=false){for(const a of media()){const start=Number(a.dataset.start),end=start+Number(a.dataset.duration),local=time-start;if(playing&&time>=start&&time<end){if(force||Math.abs(a.currentTime-local)>0.25)a.currentTime=Math.max(0,local);a.playbackRate=speed();a.play().catch(()=>{document.querySelector('#hint').textContent='瀏覽器未允許音訊播放；可按暫停後重新播放。'});}else a.pause();}}
function draw(){if(!tl)return;tl.totalTime(time,false);seek.value=time;const i=sceneAt(time);status.textContent=`${i+1} / ${META.scenes.length}　${META.scenes[i].title}　${time.toFixed(1)} / ${META.duration.toFixed(1)} 秒`;}
function jump(t){stop();time=Math.max(0,Math.min(t,META.duration));answered=new Set(META.scenes.filter(s=>s.end<=time).map(s=>s.index));draw();syncAudio(true)}
function tick(now){if(!playing)return;if(last!==null){const next=Math.min(META.duration,time+(now-last)/1000*speed());const gate=META.scenes.find(s=>s.pause&&!answered.has(s.index)&&next>=s.end-0.36&&time<s.end);if(gate){time=gate.end-0.36;answered.add(gate.index);stop();draw();play.textContent='繼續';status.textContent+='　先想一想，再繼續';return;}time=next;}last=now;draw();syncAudio();if(time>=META.duration){stop();return;}requestAnimationFrame(tick)}
play.onclick=()=>{if(!ready)return;if(playing){stop();return;}if(time>=META.duration){time=0;answered.clear();}playing=true;play.textContent='暫停';last=null;syncAudio(true);requestAnimationFrame(tick)};
document.querySelector('#prev').onclick=()=>jump(META.scenes[Math.max(0,sceneAt(time)-1)].start);
document.querySelector('#next').onclick=()=>jump(META.scenes[Math.min(META.scenes.length-1,sceneAt(time)+1)].start);
document.querySelector('#reset').onclick=()=>jump(0);
seek.max=META.duration;seek.oninput=()=>jump(Number(seek.value));
frame.onload=()=>{try{doc=frame.contentDocument;tl=frame.contentWindow.__timelines?.main;if(!tl)throw Error('缺少動畫時間軸');ready=true;play.disabled=false;draw();if(!media().length)document.querySelector('#hint').textContent='目前為無聲排版預覽，字幕時間依字數估算。題目會自動停下來，想好後按繼續。';}catch(e){status.textContent='動畫暫時無法載入。請重新整理，或返回動畫目錄重開本章。';}resize()};
addEventListener('resize',resize);resize();
// Preview controls own wall-clock playback here; index.html stays deterministic for rendering.
window.lessonPlayer={jump,get time(){return time},get playing(){return playing},get ready(){return ready},meta:META};
</script>
</html>
